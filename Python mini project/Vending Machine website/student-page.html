<!-- Keep everything the same in your HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vending Machine Products</title>
  <style>
    /* ... your existing styles ... */
    body {
      min-height: 800px;
      font-family: Arial, sans-serif;
      background-color: rgb(43, 159, 226);
      display: grid;
      align-self: center;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1976d2;
      padding: 1rem 2rem;
      color: white;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .home-btn, .cart-btn {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 0.5rem 1rem;
      border: 2px solid white;
      border-radius: 5px;
      transition: 0.3s;
      margin-left: 10px;
    }

    .home-btn:hover, .cart-btn:hover {
      background-color: white;
      color: #1976d2;
    }

    .product-grid {
      display: grid;
      align-items: center;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .product-card {
      background-color: #fff;
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: scale(1.03);
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-card h3 {
      margin: 10px 0 5px;
    }

    .product-card p {
      font-size: 14px;
      color: #555;
    }

    .product-card .price {
      font-weight: bold;
      margin: 10px 0;
      color: #222;
    }

    .product-card button {
      background-color: #1e90ff;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .product-card button:hover {
      background-color: #0074cc;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">VendoPro</div>
    <div>
      <a href="Homepage.html" class="home-btn">Home</a>
      <a href="addtocart.html" class="cart-btn">🛒 View Cart</a>
    </div>
  </nav>

  <div class="product-grid" id="productGrid">
    <!-- Products will be inserted here by JavaScript -->
  </div>

  <script>
    const products = [
      {
        name: "Snickers",
        description: "41",
        price: 50,
        image: "img/product1.jpg"
      },
      {
        name: "S'lai O lai",
        description: "42",
        price: 50,
        image: "img/product1.jpg"
      },
      {
        name: "sando cheese",
        description: "43",
        price: 30,
        image: "img/product2.jpg"
      },
      {
        name: "sando chocolate",
        description: "44",
        price: 25,
        image: "img/product3.jpg"
      },
      {
        name: "Cheese biscuit",
        description: "46",
        price: 25,
        image: "img/product3.jpg"
      },
      {
        name: "Mirinda vanilla",
        description: "34",
        price: 25,
        image: "img/product3.jpg"
      },
      {
        name: "Mirinda Strawberry",
        description: "35",
        price: 25,
        image: "img/product3.jpg"
      },
      {
        name: "Coca cola",
        description: "32",
        price: 25,
        image: "img/product3.jpg"
      },
      {
        name: "Coca cola ZERO",
        description: "36",
        price: 25,
        image: "img/product3.jpg"
      },
      {
        name: "0.5 Water bottle",
        description: "33",
        price: 25,
        image: "img/product3.jpg"
      },
      {
        name: "fuze tea Peach",
        description: "31",
        price: 25,
        image: "img/product3.jpg"
      }
    ];

    const productGrid = document.getElementById('productGrid');

    products.forEach(product => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img src="${product.image}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p>${product.description}</p>
        <p class="price">Rs${product.price}</p>
        <button onclick="addToCart('${product.name}', ${product.price}, '${product.description}')">Add to Cart</button>
      `;
      productGrid.appendChild(card);
    });

    function addToCart(name, price, id) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  const existing = cart.find(item => item.id === id);

  if (existing) {
    existing.quantity += 1;
  } else {
    cart.push({ name, price, id, quantity: 1 });
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  alert(`${name} added to cart!`);
}

  </script>
</body>
</html>
