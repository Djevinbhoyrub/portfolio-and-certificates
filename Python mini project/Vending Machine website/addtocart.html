<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Cart - VendoPro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: rgb(43, 159, 226);
      margin: 0;
      padding: 0;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1976d2;
      padding: 1rem 2rem;
      color: white;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .back-btn {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 0.5rem 1rem;
      border: 2px solid white;
      border-radius: 5px;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: white;
      color: #1976d2;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #ccc;
    }

    th {
      background-color: #1976d2;
      color: white;
    }

    .btn-buy {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background-color: #4caf50;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      float: right;
      transition: 0.3s;
    }

    .btn-buy:hover {
      background-color: #388e3c;
    }

    .empty {
      text-align: center;
      color: #555;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛒 My Cart</div>
    <a href="student-page.html" class="back-btn">← Back to Shop</a>
  </nav>

  <div class="container">
    <h1>Your Selected Items</h1>

    <div id="cartContent"></div>

    <button class="btn-buy" id="buyBtn" style="display: none;">Buy All</button>
  </div>

 <script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const cartContent = document.getElementById("cartContent");
  const buyBtn = document.getElementById("buyBtn");

  function renderCart() {
    cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
      cartContent.innerHTML = `<p class="empty">Your cart is empty.</p>`;
      buyBtn.style.display = "none";
      return;
    }

    let tableHTML = `
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>ID</th>
            <th>Price (Rs)</th>
            <th>Quantity</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
    `;

    cart.forEach((item, index) => {
      tableHTML += `
        <tr>
          <td>${item.name}</td>
          <td>${item.id}</td>
          <td>${item.price}</td>
          <td>${item.quantity}</td>
          <td>
            <button onclick="removeFromCart(${index})"
              style="background:#f44336;color:white;border:none;padding:6px 12px;border-radius:5px;cursor:pointer;">
              Remove
            </button>
          </td>
        </tr>
      `;
    });

    tableHTML += "</tbody></table>";
    cartContent.innerHTML = tableHTML;
    buyBtn.style.display = "inline-block";
  }

  function removeFromCart(index) {
    cart.splice(index, 1); // remove item at index
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart(); // re-render table
  }

  buyBtn.addEventListener("click", async () => {
    try {
      for (const item of cart) {
        await fetch("http://localhost:5000/api/buy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: item.id, quantity: item.quantity })
        });
      }
      alert("Purchase complete!");
      localStorage.removeItem("cart");
      window.location.href = "student.html";
    } catch (err) {
      alert("Something went wrong!");
      console.error(err);
    }
  });

  // Call renderCart on page load
  renderCart();
</script>

</body>
</html>
